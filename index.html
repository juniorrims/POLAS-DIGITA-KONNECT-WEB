<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Registration Form</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <h1>Student Registration Form</h1>

    <form action="#" method="post">

        <!-- Full Name -->
        <label for="fullname">Full Name:</label><br>
        <input type="text" id="fullname" name="fullname"
               placeholder="Enter your full name" required><br><br>

        <!-- Email -->
        <label for="email">Email Address:</label><br>
        <input type="email" id="email" name="email"
               placeholder="example@email.com" required><br><br>

        <!-- Phone -->
        <label for="phone">Phone Number:</label><br>
        <input type="tel" id="phone" name="phone"
               placeholder="08012345678" required><br><br>

        <!-- Age -->
        <label for="age">Age:</label><br>
        <input type="number" id="age" name="age"
               placeholder="Enter your age" min="10" max="100" required><br><br>

        <!-- Date of Birth -->
        <label for="dob">Date of Birth:</label><br>
        <input type="date" id="dob" name="dob" required><br><br>

        <!-- Website -->
        <label for="website">Personal Website:</label><br>
        <input type="url" id="website" name="website"
               placeholder="https://example.com"><br><br>

        <!-- Gender -->
        <label>Gender:</label><br>

        <input type="radio" id="male" name="gender" value="Male" required>
        <label for="male">Male</label>

        <input type="radio" id="female" name="gender" value="Female">
        <label for="female">Female</label>

        <input type="radio" id="other" name="gender" value="Other">
        <label for="other">Other</label><br><br>

        <!-- Hobbies -->
        <label>Hobbies:</label><br>

        <input type="checkbox" id="reading" name="hobbies" value="Reading">
        <label for="reading">Reading</label><br>

        <input type="checkbox" id="sports" name="hobbies" value="Sports">
        <label for="sports">Sports</label><br>

        <input type="checkbox" id="music" name="hobbies" value="Music">
        <label for="music">Music</label><br>

        <input type="checkbox" id="coding" name="hobbies" value="Coding">
        <label for="coding">Coding</label><br><br>

        <!-- Course -->
        <label for="course">Course of Study:</label><br>
        <select id="course" name="course" required>
            <option value="">--Select Course--</option>
            <option>Certificate Course</option>
            <option>Diploma Course</option>
            <option>Graphic Design</option>
            <option>Software Development</option>
            <option>Data Analysis</option>
            <option>Photo Editing</option>
        </select><br><br>

        <!-- Level -->
        <label for="level">Level:</label><br>
        <select id="level" name="level" required>
            <option value="">--Select Level--</option>
            <option>Beginner Level</option>
            <option>Intermediate Level</option>
            <option>Professional Level</option>
        </select><br><br>

        <!-- State -->
        <label for="state">State of Origin:</label><br>
        <select id="state" name="state" required>
            <option value="">--Select State--</option>
            <option>Abia</option>
            <option>Adamawa</option>
            <option>Akwa Ibom</option>
            <option>Anambra</option>
            <option>Bauchi</option>
            <option>Benue</option>
            <option>Borno</option>
            <option>Cross River</option>
            <option>Delta</option>
            <option>Ebonyi</option>
            <option>Edo</option>
            <option>Ekiti</option>
            <option>Enugu</option>
            <option>FCT</option>
            <option>Gombe</option>
            <option>Imo</option>
            <option>Jigawa</option>
            <option>Kaduna</option>
            <option>Kano</option>
            <option>Katsina</option>
            <option>Kebbi</option>
            <option>Kogi</option>
            <option>Kwara</option>
            <option>Lagos</option>
            <option>Nasarawa</option>
            <option>Niger</option>
            <option>Ogun</option>
            <option>Ondo</option>
            <option>Osun</option>
            <option>Oyo</option>
            <option>Plateau</option>
            <option>Rivers</option>
            <option>Sokoto</option>
            <option>Taraba</option>
            <option>Yobe</option>
            <option>Zamfara</option>
        </select><br><br>

        <!-- Password -->
        <label for="password">Password:</label><br>
        <input type="password" id="password" name="password"
               placeholder="Enter password" required><br><br>

        <!-- Confirm Password -->
        <label for="confirmPassword">Confirm Password:</label><br>
        <input type="password" id="confirmPassword" name="confirmPassword"
               placeholder="Confirm password" required><br><br>

        <!-- Bio -->
        <label for="bio">Short Bio:</label><br>
        <textarea id="bio" name="bio" rows="5" cols="40"
                  placeholder="Write a short bio..." required></textarea><br><br>

        <!-- Terms -->
        <input type="checkbox" id="terms" name="terms" required>
        <label for="terms">
            I agree to the Terms and Conditions
        </label><br><br>

        <!-- Buttons -->
        <input type="submit" value="Submit">
        <input type="reset" value="Reset">

    </form>
    <div>
        <footer>
            <p>&copy; 2026 Student Registration Portal. All Rights Reserved.</p>
            <p>Polas Digital Konnect</p>
        </footer>
    </div>

</body>
</html>
